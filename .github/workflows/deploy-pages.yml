name: Publish dashboard review

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out compiled review package
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Unpack static site
        run: |
          mkdir _site
          unzip -q site.zip -d _site
          test -f _site/index.html
          test -f _site/tools/pool_info/index.html
          test -f _site/files/index.html
          test -f _site/guide/index.html
      - name: Verify the public package contains no sensitive data
        run: node scripts/verify-review.mjs _site
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish Pages
        id: deployment
        uses: actions/deploy-pages@v4
